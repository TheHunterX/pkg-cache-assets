name: Asset Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (full | monitor)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - monitor
      reset_db:
        description: 'Reset state'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: asset-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Fetch workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ENGINE_REPO }}
          token: ${{ secrets.ENGINE_TOKEN }}
          path: _work
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          STATE_REPO: ${{ secrets.STATE_REPO }}
          ASSET_REPO: ${{ secrets.ASSET_REPO }}
          ASSET_PATH: ${{ secrets.ASSET_PATH }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          CIPHER_KEY: ${{ secrets.CIPHER_KEY }}
          PING_URL: ${{ secrets.PING_URL }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RESET_DB: ${{ inputs.reset_db }}
        run: |
          set +e
          cd _work && bash scripts/sync.sh > /tmp/sync.log 2>&1
          rc=$?
          rm -rf /tmp/sync.log "$GITHUB_WORKSPACE/_work"
          if [ "$rc" -eq 0 ]; then
            echo "Sync completed."
          else
            echo "Sync finished with status $rc."
          fi
          exit 0
